services:
  floci:
    image: floci/floci:latest
    container_name: decyphr-floci
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      FLOCI_SERVICES: apigateway,apigatewayv2,cloudformation,dynamodb,iam,lambda,logs,s3,ssm,sts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
