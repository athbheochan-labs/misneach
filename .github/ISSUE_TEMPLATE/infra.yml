name: Infra
description: Infrastructure, CI/CD, observability, deployment, security
title: "[Infra] "
labels: ["type:infra", "domain:infra"]
body:
  - type: dropdown
    id: deploy_impact
    attributes:
      label: Deployment Impact
      options:
        - deploy:frontend
        - deploy:backend
        - deploy:both
        - deploy:none
    validations:
      required: true

  - type: dropdown
    id: env_target
    attributes:
      label: Environment Target
      options:
        - env:staging
        - env:prod
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: Change Description
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk / Impact
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: Rollout Plan
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback Plan
    validations:
      required: true
