name: Bug
description: Functional regression or defect
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - app
        - web
        - admin
        - backend
        - infra
    validations:
      required: true

  - type: dropdown
    id: deploy_impact
    attributes:
      label: Deployment Impact
      options:
        - deploy:frontend
        - deploy:backend
        - deploy:both
        - deploy:none
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - priority:p0
        - priority:p1
        - priority:p2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      placeholder: Numbered reproduction steps
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback Plan
      placeholder: If this ships, how do we disable/revert quickly?
    validations:
      required: true
