name: Web Deploy (Amplify)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'amplify.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-amplify-deploy.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Amplify branch name'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required secrets
        env:
          APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_ID"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build web artifact
        run: |
          set -euo pipefail
          npm ci
          npm run build --workspace web
          cd apps/web/build/compute/default
          npm i --omit=dev

      - name: Upload artifact and start Amplify deployment
        env:
          APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH_NAME="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BRANCH_NAME="$INPUT_BRANCH"
          fi

          cd apps/web/build
          zip -r /tmp/web-build.zip .

          read -r JOB_ID ZIP_UPLOAD_URL <<< "$(aws amplify create-deployment \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --region "$AWS_REGION" \
            --query '[jobId,zipUploadUrl]' \
            --output text)"

          curl -sS -X PUT -T /tmp/web-build.zip "$ZIP_UPLOAD_URL"

          aws amplify start-deployment \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --job-id "$JOB_ID" \
            --region "$AWS_REGION"

          echo "Started Amplify deployment job $JOB_ID for branch $BRANCH_NAME"
