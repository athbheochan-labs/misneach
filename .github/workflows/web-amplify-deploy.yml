name: Web Deploy (Amplify)

on:
  workflow_call:
    inputs:
      branch:
        description: Amplify branch name
        required: false
        type: string
        default: main
    outputs:
      deploy_url:
        description: Deployed Amplify branch URL
        value: ${{ jobs.deploy.outputs.deploy_url }}
    secrets:
      AMPLIFY_WEB_APP_ID:
        required: true
      AWS_REGION:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
    inputs:
      branch:
        description: 'Amplify branch name'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.wait.outputs.deploy_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate required secrets
        env:
          APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_ID"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start Amplify branch deployment
        id: deploy
        env:
          APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH_NAME="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BRANCH_NAME="$INPUT_BRANCH"
          fi

          JOB_ID="$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --job-type RELEASE \
            --job-reason "GitHub Actions deployment for ${GITHUB_SHA}" \
            --region "$AWS_REGION" \
            --query 'jobSummary.jobId' \
            --output text)"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "Started Amplify deployment job $JOB_ID for branch $BRANCH_NAME"

      - name: Wait for Amplify deployment to complete
        id: wait
        env:
          APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BRANCH_NAME: ${{ steps.deploy.outputs.branch_name }}
          JOB_ID: ${{ steps.deploy.outputs.job_id }}
        run: |
          set -euo pipefail

          attempt=0
          max_attempts=60
          sleep_seconds=10

          while true; do
            status="$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH_NAME" \
              --job-id "$JOB_ID" \
              --region "$AWS_REGION" \
              --query 'job.summary.status' \
              --output text)"

            echo "Amplify job status: $status"
            if [ "$status" = "SUCCEED" ]; then
              break
            fi

            if [ "$status" = "FAILED" ] || [ "$status" = "CANCELLED" ]; then
              echo "Amplify deployment failed with status: $status"
              exit 1
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Timed out waiting for Amplify deployment to finish"
              exit 1
            fi
            sleep "$sleep_seconds"
          done

          BRANCH_WEB_URL="$(aws amplify get-branch \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH_NAME" \
            --region "$AWS_REGION" \
            --query 'branch.webUrl' \
            --output text)"

          if [ -z "$BRANCH_WEB_URL" ] || [ "$BRANCH_WEB_URL" = "None" ]; then
            BRANCH_WEB_URL="https://${BRANCH_NAME}.${APP_ID}.amplifyapp.com"
          fi

          echo "deploy_url=$BRANCH_WEB_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $BRANCH_WEB_URL"

      - name: Smoke checks (web business flows)
        env:
          DEPLOY_URL: ${{ steps.wait.outputs.deploy_url }}
        run: |
          set -euo pipefail

          require_status() {
            local expected="$1"
            local path="$2"
            local method="${3:-GET}"
            local data="${4:-}"
            local attempts="${5:-1}"
            local sleep_seconds="${6:-10}"
            local tmp
            local code
            local attempt

            for attempt in $(seq 1 "$attempts"); do
              tmp="$(mktemp)"

              if [ "$method" = "POST" ]; then
                code="$(curl -sS -o "$tmp" -w "%{http_code}" \
                  -X POST \
                  -H "content-type: application/json" \
                  -d "$data" \
                  "$DEPLOY_URL$path")"
              else
                code="$(curl -sS -o "$tmp" -w "%{http_code}" "$DEPLOY_URL$path")"
              fi

              if [ "$code" = "$expected" ]; then
                echo "Smoke check passed: $method $path -> $code"
                rm -f "$tmp"
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                echo "Smoke check pending for $method $path: expected $expected, got $code; retrying in ${sleep_seconds}s"
                rm -f "$tmp"
                sleep "$sleep_seconds"
                continue
              fi

              echo "Smoke check failed for $method $path: expected $expected, got $code"
              echo "Response body:"
              cat "$tmp"
              rm -f "$tmp"
              exit 1
            done
          }

          require_status 200 "/" "GET" "" 30 10
          require_status 200 "/taster"
          require_status 200 "/survey/setup"
          require_status 200 "/api/courses/taster"
          require_status 200 "/api/surveys/templates/public/appetite"
          require_status 400 "/api/surveys/campaigns" "POST" '{"businessName":"Smoke Test Cafe","town":"Galway"}'
          require_status 400 "/api/waitlist" "POST" '{"email":"smoke@example.com","interest":"invalid_interest"}'
