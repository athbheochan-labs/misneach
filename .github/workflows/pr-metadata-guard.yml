name: PR Metadata Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Validate linked issue, labels, and doc guardrails
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const labels = (pr.labels || []).map(l => l.name);
            const { owner, repo } = context.repo;

            const hasIssueLink = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body) || /(refs?|related to)\s+#\d+/i.test(body);
            const deployLabels = labels.filter(l => l.startsWith("deploy:"));
            const envLabels = labels.filter(l => l.startsWith("env:"));
            const hasDeployImpactLabel = deployLabels.includes("deploy:backend") || deployLabels.includes("deploy:frontend") || deployLabels.includes("deploy:both");

            const noDocImpactChecked = /-\s*\[x\]\s*No documentation impact/i.test(body);
            const noArchDocImpactChecked = /-\s*\[x\]\s*No architecture documentation impact/i.test(body) || noDocImpactChecked;

            const errors = [];

            if (!hasIssueLink) {
              errors.push("PR body must link an issue (e.g. `Closes #123`).");
            }

            if (deployLabels.length !== 1) {
              errors.push("PR must have exactly one deploy label: deploy:frontend | deploy:backend | deploy:both | deploy:none.");
            }

            if (envLabels.length > 1) {
              errors.push("PR can have at most one environment label: env:staging or env:prod.");
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changedFiles = files.map(file => file.filename);

            const touchesComposeOrEnvExamples = changedFiles.some((path) =>
              /^docker-compose(\.prod)?\.yml$/.test(path) || path.startsWith("deploy/env/examples/")
            );

            const deploymentDocsUpdated = changedFiles.some((path) =>
              path === "docs/deployment.md" || path === "deploy/env/README.md"
            );

            const touchesBackendCode = changedFiles.some((path) => {
              if (!path.startsWith("apps/") && !path.startsWith("libs/")) {
                return false;
              }
              if (
                path.startsWith("apps/web/") ||
                path.startsWith("apps/cleachtadh-web/") ||
                path.startsWith("apps/admin-web/") ||
                path.startsWith("apps/irish-week/")
              ) {
                return false;
              }
              return true;
            });

            const architectureDocsUpdated = changedFiles.some((path) =>
              path === "docs/architecture.md" || path.startsWith("docs/adr/")
            );

            const requiresDeploymentDocSignal = hasDeployImpactLabel || touchesComposeOrEnvExamples;
            if (requiresDeploymentDocSignal && !deploymentDocsUpdated && !noDocImpactChecked) {
              errors.push(
                "Deploy-impacting PRs (deploy label or compose/env example changes) must update `docs/deployment.md`/`deploy/env/README.md` or check `No documentation impact` in the PR template."
              );
            }

            if (touchesBackendCode && !architectureDocsUpdated && !noArchDocImpactChecked) {
              errors.push(
                "Backend changes must update `docs/architecture.md` or `docs/adr/*`, or check `No architecture documentation impact` (or `No documentation impact`) in the PR template."
              );
            }

            if (errors.length > 0) {
              core.setFailed(errors.join("\n"));
            } else {
              core.info("PR metadata and documentation guardrails validation passed.");
            }
