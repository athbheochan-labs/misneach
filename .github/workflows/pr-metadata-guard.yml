name: PR Metadata Guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Validate linked issue and deploy labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const labels = (pr.labels || []).map(l => l.name);

            const hasIssueLink = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body) || /(refs?|related to)\s+#\d+/i.test(body);
            const deployLabels = labels.filter(l => l.startsWith("deploy:"));
            const envLabels = labels.filter(l => l.startsWith("env:"));

            const errors = [];

            if (!hasIssueLink) {
              errors.push("PR body must link an issue (e.g. `Closes #123`).");
            }

            if (deployLabels.length !== 1) {
              errors.push("PR must have exactly one deploy label: deploy:frontend | deploy:backend | deploy:both | deploy:none.");
            }

            if (envLabels.length > 1) {
              errors.push("PR can have at most one environment label: env:staging or env:prod.");
            }

            if (errors.length > 0) {
              core.setFailed(errors.join("\n"));
            } else {
              core.info("PR metadata validation passed.");
            }
