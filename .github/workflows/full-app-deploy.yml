name: Full Application Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-app-deploy.yml'
      - '.github/workflows/backend-images-dockerhub.yml'
      - '.github/workflows/web-amplify-deploy.yml'
      - 'amplify.yml'
      - 'apps/misneach-web/**'
      - 'deploy/**'
      - 'scripts/deploy/**'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'libs/**'
      - 'services/client/**'
      - 'services/translation/translation-connector/**'
      - 'services/lexicon/**'
      - 'services/phrasebook/**'
      - 'services/flashcards/**'
      - 'services/focus/**'
      - 'services/practice/**'
      - 'services/courses/**'
      - 'services/challenges/**'
      - 'services/payment/**'
      - 'services/discounts/**'
      - 'services/business/**'
      - 'services/waitlist/**'
      - 'services/nlp/**'
  workflow_dispatch:

env:
  NODE_VERSION: 22
  TARGET_ENV: production

permissions:
  contents: read

concurrency:
  group: full-app-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production deploy inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate required secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          AMPLIFY_WEB_APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_USER"
          test -n "$PROD_SSH_KEY"
          test -n "$AMPLIFY_WEB_APP_ID"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Validate env manifest
        run: npm run render:env -- --validate-only --summary

      - name: Check runtime env contract
        run: npm run check:env-contract

      - name: Build web workspace
        run: |
          set -euo pipefail
          npm run build --workspace misneach-web

  publish-images:
    name: Build and publish Docker images
    needs: validate
    uses: ./.github/workflows/backend-images-dockerhub.yml
    with:
      service: backend
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}

  deploy-compose:
    name: Deploy production compose services
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_ORG != '' && secrets.DOCKERHUB_ORG || secrets.DOCKERHUB_USERNAME }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH || '/opt/misneach' }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE || '/opt/misneach/.env' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify published image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          images=(
            backend-runtime
            nlp
          )

          for image in "${images[@]}"; do
            docker manifest inspect "$IMAGE_NAMESPACE/misneach-$image:$IMAGE_TAG" >/dev/null
          done

      - name: Configure SSH
        id: configure-ssh
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/production_deploy_key
          chmod 600 ~/.ssh/production_deploy_key
          ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Render production env files from SSM
        run: |
          set -euo pipefail
          mkdir -p /tmp/misneach-rendered-env
          npm run render:env -- \
            --manifest deploy/env/manifest.json \
            --provider aws \
            --output-dir /tmp/misneach-rendered-env \
            --summary
          tar -C /tmp/misneach-rendered-env -czf /tmp/misneach-rendered-env.tar.gz .

      - name: Docker login on production host
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Upload production compose files
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -euo pipefail
             mkdir -p /tmp/misneach-deploy
             sudo mkdir -p '$PROD_DEPLOY_PATH/deploy/proxy'"
          scp -i ~/.ssh/production_deploy_key -P "$PROD_SSH_PORT" \
            docker-compose.prod.yml \
            "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/misneach-deploy/docker-compose.prod.yml"
          scp -i ~/.ssh/production_deploy_key -P "$PROD_SSH_PORT" \
            deploy/proxy/nginx.client-api.conf \
            "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/misneach-deploy/nginx.client-api.conf"
          scp -i ~/.ssh/production_deploy_key -P "$PROD_SSH_PORT" \
            /tmp/misneach-rendered-env.tar.gz \
            "$PROD_SSH_USER@$PROD_SSH_HOST:/tmp/misneach-deploy/env.tar.gz"
          ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -euo pipefail
             mkdir -p /tmp/misneach-deploy/env
             tar -xzf /tmp/misneach-deploy/env.tar.gz -C /tmp/misneach-deploy/env
             sudo install -m 0644 /tmp/misneach-deploy/docker-compose.prod.yml '$PROD_DEPLOY_PATH/docker-compose.prod.yml'
             sudo install -m 0644 /tmp/misneach-deploy/nginx.client-api.conf '$PROD_DEPLOY_PATH/deploy/proxy/nginx.client-api.conf'
             sudo mkdir -p '$PROD_DEPLOY_PATH/env'
             for env_file in /tmp/misneach-deploy/env/*.env; do
               [ -f \"\$env_file\" ] || continue
               sudo install -m 0600 -o '$PROD_SSH_USER' -g '$PROD_SSH_USER' \"\$env_file\" '$PROD_DEPLOY_PATH/env/'\"\$(basename \"\$env_file\")\"
             done
             rm -rf /tmp/misneach-deploy"

      - name: Free Docker disk before pulling images
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -euo pipefail
             echo 'Disk before Docker cleanup:'
             df -h /
             docker system df || true
             docker container prune -f
             docker image prune -af
             docker builder prune -af
             echo 'Disk after Docker cleanup:'
             df -h /
             docker system df || true"

      - name: Pull and restart production compose services
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "set -euo pipefail
             cd '$PROD_DEPLOY_PATH'
             COMPOSE_PARALLEL_LIMIT=1 DOCKERHUB_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file '$PROD_ENV_FILE' -f docker-compose.prod.yml pull
             COMPOSE_PARALLEL_LIMIT=1 DOCKERHUB_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file '$PROD_ENV_FILE' -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
             COMPOSE_PARALLEL_LIMIT=1 DOCKERHUB_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file '$PROD_ENV_FILE' -f docker-compose.prod.yml ps"

      - name: Production health checks
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "PROD_DEPLOY_PATH='$PROD_DEPLOY_PATH' PROD_ENV_FILE='$PROD_ENV_FILE' DOCKERHUB_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$PROD_DEPLOY_PATH"

          compose() {
            docker compose --env-file "$PROD_ENV_FILE" -f docker-compose.prod.yml "$@"
          }

          check_api_proxy() {
            compose exec -T api-proxy wget -q -O /dev/null http://127.0.0.1/healthz
          }

          check_client() {
            compose exec -T client node -e "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch((error)=>{ console.error(error); process.exit(1); })"
          }

          wait_for_check() {
            local name="$1"
            local command_name="$2"

            for attempt in $(seq 1 30); do
              if "$command_name"; then
                echo "Health check passed: $name"
                return 0
              fi

              echo "Health check pending: $name ($attempt/30)"
              sleep 10
            done

            echo "Health check failed: $name"
            compose ps
            compose logs --tail=160 "$name" || true
            return 1
          }

          wait_for_check api-proxy check_api_proxy
          wait_for_check client check_client
          REMOTE

      - name: Compose diagnostics on failure
        if: failure() && steps.configure-ssh.outcome == 'success'
        run: |
          set +e
          ssh -i ~/.ssh/production_deploy_key -p "$PROD_SSH_PORT" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "cd '$PROD_DEPLOY_PATH'
             DOCKERHUB_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file '$PROD_ENV_FILE' -f docker-compose.prod.yml ps
             DOCKERHUB_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_TAG='$IMAGE_TAG' docker compose --env-file '$PROD_ENV_FILE' -f docker-compose.prod.yml logs --tail=120 api-proxy client || true"

      - name: Compose deployment summary
        run: |
          {
            echo "## Production compose deployment"
            echo ""
            echo "- Target: \`$TARGET_ENV\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image namespace: \`$IMAGE_NAMESPACE\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Compose path: \`$PROD_DEPLOY_PATH\`"
            echo "- Runtime env source: \`SSM /misneach/prod/*\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-misneach-web:
    name: Deploy misneach-web to Amplify
    needs: deploy-compose
    uses: ./.github/workflows/web-amplify-deploy.yml
    with:
      branch: main
    secrets:
      AMPLIFY_WEB_APP_ID: ${{ secrets.AMPLIFY_WEB_APP_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deployment-summary:
    name: Deployment summary
    needs:
      - publish-images
      - deploy-compose
      - deploy-misneach-web
    if: always()
    runs-on: ubuntu-latest
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_ORG != '' && secrets.DOCKERHUB_ORG || secrets.DOCKERHUB_USERNAME }}
      CLEACHTADH_WEB_URL: ${{ vars.CLEACHTADH_WEB_URL }}
      ADMIN_WEB_URL: ${{ vars.ADMIN_WEB_URL }}
    steps:
      - name: Print deployment summary
        run: |
          {
            echo "## Full application deployment"
            echo ""
            echo "- Target: \`production\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Docker image tag: \`$GITHUB_SHA\`"
            echo "- Docker namespace: \`$IMAGE_NAMESPACE\`"
            echo "- Backend runtime image: \`misneach-backend-runtime:$GITHUB_SHA\`"
            echo "- NLP image: \`misneach-nlp:$GITHUB_SHA\`"
            echo "- Misneach web: ${{ needs.deploy-misneach-web.outputs.deploy_url || 'not reported' }}"
            echo "- Cleachtadh web: ${CLEACHTADH_WEB_URL:-set CLEACHTADH_WEB_URL repo variable}"
            echo "- Admin web: ${ADMIN_WEB_URL:-set ADMIN_WEB_URL repo variable}"
            echo ""
            echo "Results:"
            echo "- Image publish: \`${{ needs.publish-images.result }}\`"
            echo "- Compose deploy: \`${{ needs.deploy-compose.result }}\`"
            echo "- Misneach web deploy: \`${{ needs.deploy-misneach-web.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.publish-images.result }}" != "success" ] ||
             [ "${{ needs.deploy-compose.result }}" != "success" ] ||
             [ "${{ needs.deploy-misneach-web.result }}" != "success" ]; then
            exit 1
          fi
