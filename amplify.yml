version: 1
applications:
  - appRoot: apps/web
    frontend:
      # Run commands from repo root so npm workspace scripts resolve correctly.
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - rm -f apps/web/.env.production
            - touch apps/web/.env.production
            - for key in NEST_INTERNAL_URL NEST_INTERNAL_URLS CLIENT_API_URL APP_BASE_URL WEB_APP_URL; do value="$(printenv "$key" || true)"; if [ -n "$value" ]; then printf '%s=%s\n' "$key" "$value" >> apps/web/.env.production; fi; done
            - npm run build --workspace web
            # Install runtime dependencies for the SSR compute bundle.
            - cd apps/web/build/compute/default
            - npm i --omit=dev
      artifacts:
        baseDirectory: apps/web/build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
