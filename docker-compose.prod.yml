version: "3.9"

name: misneach

x-backend-common: &backend-common
  image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/misneach-backend-runtime:${IMAGE_TAG:-latest}
  restart: unless-stopped

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/mariadb.env
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER:-root} -p$${MARIADB_PASSWORD:-$${MARIADB_ROOT_PASSWORD}} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  translator:
    <<: *backend-common
    working_dir: /usr/src/app/services/translation/translation-connector
    command: ["node", "dist/main"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/translator.env
    expose:
      - "3009"

  nlp:
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/misneach-nlp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8300"

  lexicon:
    <<: *backend-common
    working_dir: /usr/src/app/services/lexicon
    command: ["./entrypoint.sh"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/lexicon.env
    expose:
      - "3010"

  phrasebook:
    <<: *backend-common
    working_dir: /usr/src/app/services/phrasebook
    command: ["./entrypoint.sh"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/phrasebook.env
    expose:
      - "3011"

  flashcards:
    <<: *backend-common
    working_dir: /usr/src/app/services/flashcards
    command: ["./entrypoint.sh"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/flashcards.env
    expose:
      - "3012"

  focus:
    <<: *backend-common
    working_dir: /usr/src/app/services/focus
    command: ["node", "dist/main"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/focus.env
    expose:
      - "3013"

  practice:
    <<: *backend-common
    working_dir: /usr/src/app/services/practice
    command: ["./entrypoint.sh"]
    depends_on:
      - mariadb
      - phrasebook
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/practice.env
    expose:
      - "3014"

  courses:
    <<: *backend-common
    working_dir: /usr/src/app/services/courses
    command: ["./entrypoint.sh"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/courses.env
    expose:
      - "3015"

  challenges:
    <<: *backend-common
    working_dir: /usr/src/app/services/challenges
    command: ["node", "dist/main"]
    depends_on:
      - mariadb
      - courses
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/challenges.env
    expose:
      - "3016"

  payment:
    <<: *backend-common
    working_dir: /usr/src/app/services/payment
    command: ["node", "dist/main"]
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/payment.env
    expose:
      - "3017"

  discounts:
    <<: *backend-common
    working_dir: /usr/src/app/services/discounts
    command: ["node", "dist/main"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/discounts.env
    expose:
      - "3020"

  business:
    <<: *backend-common
    working_dir: /usr/src/app/services/business
    command: ["node", "dist/main"]
    depends_on:
      - payment
      - discounts
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/business.env
    expose:
      - "3018"

  waitlist:
    <<: *backend-common
    working_dir: /usr/src/app/services/waitlist
    command: ["node", "dist/main"]
    depends_on:
      - mariadb
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/waitlist.env
    expose:
      - "3021"

  client:
    <<: *backend-common
    working_dir: /usr/src/app/services/client
    command: ["node", "dist/main"]
    depends_on:
      - mariadb
      - flashcards
      - focus
      - practice
      - courses
      - challenges
      - payment
      - business
      - discounts
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/client.env
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cleachtadh-web:
    <<: *backend-common
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/misneach-cleachtadh-web:${IMAGE_TAG:-latest}
    depends_on:
      - client
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/cleachtadh-web.env
    ports:
      - "5175:5175"

  admin-web:
    <<: *backend-common
    image: ${DOCKERHUB_NAMESPACE:?Set DOCKERHUB_NAMESPACE}/misneach-admin-web:${IMAGE_TAG:-latest}
    depends_on:
      - client
    env_file:
      - ${ENV_DIR:-/opt/misneach/env}/admin-web.env
    ports:
      - "5174:5174"

  api-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - client
    ports:
      - "8000:80"
    volumes:
      - ./deploy/proxy/nginx.client-api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mariadb_data:
