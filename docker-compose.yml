version: "3"

x-backend-build: &backend-build
  context: .
  dockerfile: ./docker/Dockerfile.backend

x-backend-service: &backend-service
  image: misneach-backend:latest
  build: *backend-build

services:
  mariadb:
    image: mariadb:latest
    env_file:
      - ./docker/env/mariadb.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  translator:
    <<: *backend-service
    working_dir: /usr/src/app/apps/translation/translation-connector
    command: ["node", "dist/main"]
    ports:
      - "3009:3009"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/translation/translation-connector/.env

  nlp:
    build:
      context: ./nlp
    container_name: nlp
    ports:
      - "8300:8300"
    restart: unless-stopped
  lexicon:
    <<: *backend-service
    working_dir: /usr/src/app/apps/lexicon
    command: ["./entrypoint.sh"]
    ports:
      - "3010:3010"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/lexicon/.env
  phrasebook:
    <<: *backend-service
    working_dir: /usr/src/app/apps/phrasebook
    command: ["./entrypoint.sh"]
    ports:
      - "3011:3011"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/phrasebook/.env

  flashcards:
    <<: *backend-service
    working_dir: /usr/src/app/apps/flashcards
    command: ["./entrypoint.sh"]
    ports:
      - "3012:3012"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/flashcards/.env

  focus:
    <<: *backend-service
    working_dir: /usr/src/app/apps/focus
    command: ["node", "dist/main"]
    expose:
      - "3013"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/focus/.env

  practice:
    <<: *backend-service
    working_dir: /usr/src/app/apps/practice
    command: ["./entrypoint.sh"]
    expose:
      - "3014"
    restart: always
    depends_on:
      - mariadb
      - phrasebook
    env_file:
      - ./apps/practice/.env

  courses:
    <<: *backend-service
    working_dir: /usr/src/app/apps/courses
    command: ["./entrypoint.sh"]
    expose:
      - "3015"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/courses/.env

  challenges:
    <<: *backend-service
    working_dir: /usr/src/app/apps/challenges
    command: ["node", "dist/main"]
    expose:
      - "3016"
    restart: always
    depends_on:
      - mariadb
      - courses
    env_file:
      - ./apps/challenges/.env

  payment:
    <<: *backend-service
    working_dir: /usr/src/app/apps/payment
    command: ["node", "dist/main"]
    expose:
      - "3017"
    restart: always
    env_file:
      - ./apps/payment/.env

  discounts:
    <<: *backend-service
    working_dir: /usr/src/app/apps/discounts
    command: ["node", "dist/main"]
    expose:
      - "3020"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/discounts/.env

  business:
    <<: *backend-service
    working_dir: /usr/src/app/apps/business
    command: ["node", "dist/main"]
    expose:
      - "3018"
    restart: always
    depends_on:
      - payment
      - discounts
    env_file:
      - ./apps/business/.env

  waitlist:
    <<: *backend-service
    working_dir: /usr/src/app/apps/waitlist
    command: ["node", "dist/main"]
    expose:
      - "3021"
    restart: always
    depends_on:
      - mariadb
    env_file:
      - ./apps/waitlist/.env

  client:
    <<: *backend-service
    working_dir: /usr/src/app/apps/client
    command: ["node", "dist/main"]
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - mariadb
      - flashcards
      - focus
      - practice
      - courses
      - challenges
      - payment
      - business
      - discounts
    env_file:
      - ./apps/client/.env
      - ./docker/env/client.env

  web:
    build:
      context: .
      dockerfile: ./apps/misneach-web/Dockerfile
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - business
      - waitlist
    env_file:
      - ./docker/env/web.env

  cleachtadh-web:
    build:
      context: .
      dockerfile: ./apps/cleachtadh-web/Dockerfile
    ports:
      - "5175:5175"
    restart: always
    depends_on:
      - client
    env_file:
      - ./docker/env/cleachtadh-web.env

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: ./Dockerfile
    ports:
      - "5174:5174"
    restart: always
    depends_on:
      - client
    env_file:
      - ./docker/env/web.env

volumes:
  mariadb_data:
  redis_data:
